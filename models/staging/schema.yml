version: 2

models:
  - name: stg_orders
    description: "Staging table for orders data."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Identifier for the customer who placed the order."
        tests:
          - not_null
      - name: status
        tests: 
          - accepted_values:
              values: ['pending', 'processing', 'shipped', 'delivered', 'cancelled']

  - name: stg_customers
    description: "Staging table for customers data."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        tests:
          - not_null
          - unique
      - name: customer_name
        description: "Full name of the customer."
      - name: email
        description: "Email address of the customer."
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Staging table for products data."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        tests:
          - not_null
          - unique
      - name: product_name
        description: "Name of the product."
      - name: category
        description: "Category to which the product belongs."
        
  - name: stg_order_items
    description: "Staging table for order items data."
    columns:
      - name: order_item_id
        description: "Unique identifier for each order item."
        tests:
          - not_null
          - unique
      - name: order_id
        description: "Identifier for the order to which this item belongs."
        tests:
          - not_null
      - name: product_id
        description: "Identifier for the product in this order item."
        tests:
          - not_null
      - name: quantity
        description: "Quantity of the product ordered in this item."
        tests:
          - not_null

  - name: stg_categories
    description: "Staging table for product categories data."
    columns:
      - name: category_id
        description: "Unique identifier for each category."
        tests:
          - not_null
          - unique
      - name: category_name
        description: "Name of the product category."
