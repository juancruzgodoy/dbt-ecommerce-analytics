version: 2

models:
  - name: int_order_items_products
    description: "Intermediate table joining order items with product and category information."
    columns:
      - name: order_item_id
        description: "Unique identifier for each order item."
        tests:
          - not_null
          - unique
      - name: order_id
        description: "Identifier for the order to which this item belongs."
        tests:
          - not_null
      - name: quantity
        description: "Quantity of the product ordered."
        tests:
          - not_null
      - name: unit_price
        description: "Price per unit of the product in this order item."
      - name: product_id
        description: "Unique identifier for the product."
        tests:
          - not_null
      - name: product_name
        description: "Name of the product."
      - name: product_price
        description: "Standard price of the product."
      - name: category_name
        description: "Category to which the product belongs."
      - name: total_amount
        description: "Total amount for this order item (quantity * unit_price)."
      - name: total_profit
        description: "Total profit for this order item ((unit_price - cost) * quantity)."

  - name: int_orders_customers
    description: "Intermediate table joining orders with customer information."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Identifier for the customer who placed the order."
      - name: order_date
        description: "Date when the order was placed."
        tests:
          - not_null
      - name: status
        description: "Current status of the order."
      - name: total_amount
        description: "Total amount of the order."
      - name: first_name
        description: "First name of the customer."
      - name: last_name
        description: "Last name of the customer."
      - name: email
        description: "Email address of the customer."
      - name: city
        description: "City where the customer is located."
      - name: country
        description: "Country where the customer is located."
      - name: customer_type
        description: "Type of customer (Guest or Registered)."

  - name: int_products_enriched
    description: "Intermediate table with products enriched with category information."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        tests:
          - not_null
          - unique
      - name: sku
        description: "Stock keeping unit identifier for the product."
      - name: product_name
        description: "Name of the product."
      - name: description
        description: "Description of the product."
      - name: price
        description: "Price of the product."
      - name: category_name
        description: "Category to which the product belongs."
